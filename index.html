<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/extensions.css">
  <link rel="stylesheet" href="./css/extension-grid.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Browser extensions manager UI</title>

</head>

<body>
  <header class="header">
    <nav class="header__top">
      <div class="header__brand">
        <img src="./assets/images/logo.svg" alt="logo" aria-hidden="true">
      </div>
      <div class="header__theme">
        <button class="header__theme-toggle header__theme-toggle--moon" aria-label="Alterar tema"></button>
      </div>
    </nav>
  </header>
  <main>
    <section class="extensions">
      <h1 class="extensions__title">Extensions List</h1>
      <div class="extensions__filters">
        <button class="extensions__filter extensions__filter--active" data-filter="all">All</button>
        <button class="extensions__filter" data-filter="active">Active</button>
        <button class="extensions__filter" data-filter="inactive">Inactive</button>
      </div>
    </section>
    <section class="extensions-grid">
      <h2 class="visually-hidden">Grupo de Extensões</h2>
    </section>
  </main>

  <footer class="footer">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/0rafae1">Rafael Sousa</a>.
  </footer>
  <script type="module" src="./js/main.js"></script>
</body>

</html>
