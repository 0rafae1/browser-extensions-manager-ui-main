<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/extensions.css">
  <link rel="stylesheet" href="./css/extension-grid.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Browser extensions manager UI</title>

</head>

<body>
  <header class="header">
    <nav class="header__top">
      <div class="header__brand">
        <img src="./assets/images/logo.svg" alt="logo" aria-hidden="true">
      </div>
      <div class="header__theme">
        <button class="header__theme-toggle header__theme-toggle--moon" aria-label="Alterar tema"></button>
      </div>
    </nav>
  </header>
  <main>
    <section class="extensions-list">
      <h1 class="extensions-list__tittle">Extensions List</h1>
      <div class="extensions-list__filters">
        <button class="extensions-list__filters-filter">All</button>
        <button class="extensions-list__filters-filter">Active</button>
        <button class="extensions-list__filters-filter">Inactive</button>
      </div>
    </section>
    <section class="extensions-grid">
      <h2 class="visually-hidden">Grupo de Extensões</h2>
      <div class="extensions-grid__extension">
        <div class="extensions-grid__extension-icon-wrapper">
          <img src="./assets/images/logo-devlens.svg" alt="Ícone da extensão DevLens">
          <div class="extensions-grid__extension-info">
            <h3 class="extensions-grid__extension-name">DevLens</h3>
            <p class="extensions-grid__extension-description">Quickly inspect page layouts and visualize element boundaries.</p>
          </div>
        </div>
        <div class="extensions-grid__extension-actions">
          <button class="extensions-grid__extension-remove">Remove</button>
          <label class="extensions-grid__extension-toggle">
            <input type="checkbox" class="extensions-grid__extension-toggle-input">
            <span class="extensions-grid__extension-toggle-slider"></span>
          </label>
        </div>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/0rafae1">Rafael Sousa</a>.
  </footer>
</body>

</html>
